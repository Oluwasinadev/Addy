<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDY - Math Game</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent: #4a4a4a;
            --success: #2ecc71;
            --error: #e74c3c;
            --text: #ffffff;
            --text-dim: #b3b3b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 540px;
            height: 100%;
            position: relative;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
        }

        /* Navigation Drawer */
        #drawer {
            position: absolute;
            left: -100%;
            top: 0;
            width: 70%;
            height: 100%;
            background: #1f1f1f;
            z-index: 100;
            transition: 0.3s;
            padding-top: 50px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        #drawer.open { left: 0; }

        .drawer-item {
            padding: 20px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }

        .drawer-item:hover { background: #333; }

        /* Header */
        header {
            background: #222;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn { font-size: 24px; cursor: pointer; background: none; border: none; color: white; }

        /* Screens */
        .screen {
            flex: 1;
            padding: 20px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .active-screen { display: flex; }

        /* Game UI Elements */
        .question-display {
            font-size: 42px;
            text-align: center;
            margin: 40px 0;
            font-weight: bold;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: var(--accent);
        }

        button.selected { background: var(--success) !important; }
        button.wrong { background: var(--error) !important; }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .btn-check { background: var(--success); }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label { color: var(--text-dim); font-size: 12px; }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--success); }

        /* Input Styles */
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Navigation Drawer -->
    <div id="drawer">
        <div class="drawer-item" onclick="showScreen('game-screen')">🎮 PLAY</div>
        <div class="drawer-item" onclick="showScreen('profile-screen')">👤 PROFILE</div>
        <div class="drawer-item" onclick="showScreen('test-screen')">🧪 MULTIPLICATION TEST</div>
        <div class="drawer-item" onclick="showScreen('feedback-screen')">💬 FEEDBACK</div>
    </div>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div id="header-stats">Score: 0 | Lvl: 1</div>
    </header>

    <!-- Game Screen -->
    <main id="game-screen" class="screen active-screen">
        <div class="question-display" id="question-text">5 + 5 = ?</div>
        <div class="numbers-grid" id="numbers-grid"></div>
        <div id="answer-preview" style="text-align: center; color: #888; margin-bottom: 20px;">Select numbers</div>
        
        <div class="action-buttons">
            <button class="btn-check" onclick="checkAnswer()">CHECK</button>
            <button onclick="newQuestion()">SKIP</button>
            <button onclick="clearSelection()">CLEAR</button>
        </div>
    </main>

    <!-- Profile Screen -->
    <main id="profile-screen" class="screen">
        <h2 style="margin-bottom: 20px;">📊 YOUR PROFILE</h2>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="player-name-input" placeholder="Player Name">
            <button onclick="saveName()" style="padding: 10px;">Save</button>
        </div>
        <div class="stats-grid" id="stats-display">
            <!-- Stats injected here -->
        </div>
    </main>

    <!-- Test Screen -->
    <main id="test-screen" class="screen">
        <h2>🧪 TIMED TEST</h2>
        <div id="test-timer" style="font-size: 30px; text-align:center; color:var(--success); margin: 20px;">60s</div>
        <div id="test-question" class="question-display">Ready?</div>
        <input type="number" id="test-input" placeholder="Result...">
        <button id="test-start-btn" onclick="startTest()" style="background:var(--success); width:100%;">START</button>
    </main>

    <!-- Feedback Screen -->
    <main id="feedback-screen" class="screen">
        <h2>💬 FEEDBACK</h2>
        <button onclick="window.open('https://wa.me/1234567890')" style="background:#25D366; margin: 20px 0;">WhatsApp Support</button>
        <textarea id="feedback-text" rows="5" placeholder="Tell us how to improve..."></textarea>
        <button onclick="submitFeedback()" style="background:var(--success)">Submit Feedback</button>
    </main>

    <div id="popup" class="popup"></div>
</div>

<script>
    // State Management
    let data = JSON.parse(localStorage.getItem('addy_data')) || {
        name: "Player",
        score: 0,
        level: 1,
        streak: 0,
        correct: 0,
        wrong: 0,
        gamesPlayed: 0
    };

    let currentQuestion = { ans: 0, selected: [] };
    let testActive = false;
    let testTimer = 60;

    // Initialization
    function init() {
        updateUIStats();
        newQuestion();
        document.getElementById('player-name-input').value = data.name;
    }

    // Navigation
    function toggleMenu() {
        document.getElementById('drawer').classList.toggle('open');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
        toggleMenu();
        if(screenId === 'profile-screen') renderProfile();
    }

    // Game Logic
    function newQuestion() {
        const max = 5 + (data.level * 2);
        const n1 = Math.floor(Math.random() * max) + 2;
        const n2 = Math.floor(Math.random() * max) + 2;
        const op = Math.random() > 0.5 ? '+' : '*';
        
        currentQuestion.ans = op === '+' ? n1 + n2 : n1 * n2;
        currentQuestion.selected = [];
        
        document.getElementById('question-text').innerText = `${n1} ${op === '+' ? '+' : '×'} ${n2} = ?`;
        renderNumbers();
        updatePreview();
    }

    function renderNumbers() {
        const grid = document.getElementById('numbers-grid');
        grid.innerHTML = '';
        let nums = new Set([currentQuestion.ans]);
        while(nums.size < 6) {
            let n = Math.floor(Math.random() * (currentQuestion.ans + 10)) + 1;
            if(n > 0) nums.add(n);
        }
        
        [...nums].sort(() => Math.random() - 0.5).forEach(n => {
            const btn = document.createElement('button');
            btn.innerText = n;
            btn.onclick = () => selectNumber(n, btn);
            grid.appendChild(btn);
        });
    }

    function selectNumber(n, btn) {
        if(!currentQuestion.selected.includes(n)) {
            currentQuestion.selected.push(n);
            btn.classList.add('selected');
            updatePreview();
        }
    }

    function updatePreview() {
        const p = document.getElementById('answer-preview');
        if(currentQuestion.selected.length === 0) {
            p.innerText = "Select numbers";
        } else {
            const sum = currentQuestion.selected.reduce((a, b) => a + b, 0);
            p.innerText = currentQuestion.selected.join(' + ') + ` = ${sum}`;
        }
    }

    function checkAnswer() {
        const sum = currentQuestion.selected.reduce((a, b) => a + b, 0);
        if(sum === currentQuestion.ans) {
            data.score += 10;
            data.correct++;
            data.streak++;
            if(data.streak % 5 === 0) data.level++;
            showPopup("🎉 CORRECT!", "success");
            setTimeout(newQuestion, 1000);
        } else {
            data.wrong++;
            data.streak = 0;
            showPopup(`Wrong! Answer was ${currentQuestion.ans}`, "error");
        }
        data.gamesPlayed++;
        saveData();
        updateUIStats();
    }

    function clearSelection() {
        currentQuestion.selected = [];
        document.querySelectorAll('.numbers-grid button').forEach(b => b.classList.remove('selected'));
        updatePreview();
    }

    // Profile & Data
    function saveData() {
        localStorage.setItem('addy_data', JSON.stringify(data));
    }

    function updateUIStats() {
        document.getElementById('header-stats').innerText = `Score: ${data.score} | Lvl: ${data.level}`;
    }

    function saveName() {
        data.name = document.getElementById('player-name-input').value;
        saveData();
        showPopup("Name Saved!");
    }

    function renderProfile() {
        const container = document.getElementById('stats-display');
        const stats = [
            ["📈 Score", data.score],
            ["🔥 Streak", data.streak],
            ["⭐ Level", data.level],
            ["✅ Correct", data.correct],
            ["❌ Wrong", data.wrong],
            ["🎮 Games", data.gamesPlayed]
        ];
        container.innerHTML = stats.map(s => `
            <div class="stat-card">
                <div class="stat-label">${s[0]}</div>
                <div class="stat-value">${s[1]}</div>
            </div>
        `).join('');
    }

    // Test Mode
    function startTest() {
        testActive = true;
        testTimer = 60;
        let score = 0;
        document.getElementById('test-start-btn').style.display = 'none';
        
        const runTimer = setInterval(() => {
            testTimer--;
            document.getElementById('test-timer').innerText = testTimer + "s";
            if(testTimer <= 0) {
                clearInterval(runTimer);
                testActive = false;
                alert("Test Over! You answered " + score + " questions.");
                document.getElementById('test-start-btn').style.display = 'block';
            }
        }, 1000);

        const ask = () => {
            const n1 = Math.floor(Math.random() * 10) + 2;
            const n2 = Math.floor(Math.random() * 10) + 2;
            const ans = n1 * n2;
            document.getElementById('test-question').innerText = `${n1} × ${n2} = ?`;
            
            const input = document.getElementById('test-input');
            input.value = '';
            input.focus();
            input.onkeyup = (e) => {
                if(parseInt(input.value) === ans) {
                    score++;
                    ask();
                }
            };
        };
        ask();
    }

    function showPopup(msg, type) {
        const p = document.getElementById('popup');
        p.innerText = msg;
        p.style.display = 'block';
        p.style.color = type === 'error' ? 'var(--error)' : 'var(--success)';
        setTimeout(() => p.style.display = 'none', 1500);
    }

    init();
</script>
</body>
</html>
