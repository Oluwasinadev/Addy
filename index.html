<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ADDY Swipe</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #3d3d3d;
            --primary: #00e676;
            --error: #ff5252;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents scrolling while swiping */
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: var(--card);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .score-board { font-size: 1.2rem; color: var(--primary); font-weight: bold; }

        #question-container {
            margin: 40px 0;
            font-size: 3rem;
            font-weight: bold;
            transition: transform 0.2s;
        }

        /* The Grid */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .number-node {
            height: 80px;
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            user-select: none;
            transition: all 0.2s;
            z-index: 2;
        }

        .number-node.active {
            background: var(--primary);
            border-color: #fff;
            transform: scale(1.1);
        }

        /* Canvas for drawing the swipe line */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .flash-error { animation: shake 0.4s; color: var(--error); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="score-board">SCORE: <span id="score">0</span> | LVL: <span id="level">1</span></div>
    </header>

    <div id="question-container">---</div>

    <div id="game-grid">
        <canvas id="line-canvas"></canvas>
        </div>

    <div id="feedback" style="margin-top: 20px; color: #888;">Swipe numbers to sum them up!</div>

    <script>
        let score = 0;
        let level = 1;
        let targetValue = 0;
        let selectedNodes = [];
        let isSwiping = false;

        const questionEl = document.getElementById('question-container');
        const gridEl = document.getElementById('game-grid');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        function initGame() {
            generateQuestion();
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            // Touch/Mouse Events
            gridEl.addEventListener('mousedown', startSwipe);
            gridEl.addEventListener('mousemove', continueSwipe);
            window.addEventListener('mouseup', endSwipe);

            gridEl.addEventListener('touchstart', (e) => startSwipe(e.touches[0]));
            gridEl.addEventListener('touchmove', (e) => continueSwipe(e.touches[0]));
            window.addEventListener('touchend', endSwipe);
        }

        function generateQuestion() {
            const max = 5 + (level * 3);
            const n1 = Math.floor(Math.random() * max) + 2;
            const n2 = Math.floor(Math.random() * max) + 2;
            targetValue = n1 + n2;
            questionEl.innerText = `${n1} + ${n2} = ?`;
            questionEl.classList.remove('flash-error');
            renderGrid();
        }

        function renderGrid() {
            // Remove old nodes but keep canvas
            const nodes = gridEl.querySelectorAll('.number-node');
            nodes.forEach(n => n.remove());

            let pool = [Math.floor(targetValue/2), targetValue - Math.floor(targetValue/2)];
            if (pool[0] === pool[1]) pool[1] += 1; // ensure variety

            while(pool.length < 9) {
                pool.push(Math.floor(Math.random() * targetValue) + 1);
            }
            pool.sort(() => Math.random() - 0.5);

            pool.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'number-node';
                div.innerText = val;
                div.dataset.index = i;
                div.dataset.value = val;
                gridEl.appendChild(div);
            });
        }

        function resizeCanvas() {
            canvas.width = gridEl.offsetWidth;
            canvas.height = gridEl.offsetHeight;
        }

        function startSwipe(e) {
            isSwiping = true;
            selectedNodes = [];
            clearCanvas();
            handleMove(e.clientX, e.clientY);
        }

        function continueSwipe(e) {
            if (!isSwiping) return;
            handleMove(e.clientX, e.clientY);
        }

        function handleMove(x, y) {
            const element = document.elementFromPoint(x, y);
            if (element && element.classList.contains('number-node')) {
                const index = element.dataset.index;
                if (!selectedNodes.includes(element)) {
                    selectedNodes.push(element);
                    element.classList.add('active');
                }
            }
            drawLines();
        }

        function endSwipe() {
            if (!isSwiping) return;
            isSwiping = false;

            const sum = selectedNodes.reduce((acc, node) => acc + parseInt(node.dataset.value), 0);

            if (sum === targetValue && selectedNodes.length >= 1) {
                score += 10;
                if (score % 50 === 0) level++;
                document.getElementById('score').innerText = score;
                document.getElementById('level').innerText = level;
                generateQuestion();
            } else {
                questionEl.classList.add('flash-error');
                setTimeout(generateQuestion, 500); 
            }

            // Cleanup
            selectedNodes.forEach(n => n.classList.remove('active'));
            selectedNodes = [];
            clearCanvas();
        }

        function drawLines() {
            clearCanvas();
            if (selectedNodes.length < 1) return;

            ctx.beginPath();
            ctx.strokeStyle = '#00e676';
            ctx.lineWidth = 5;
            ctx.lineJoin = 'round';

            selectedNodes.forEach((node, i) => {
                const rect = node.getBoundingClientRect();
                const gridRect = gridEl.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) - gridRect.left;
                const y = (rect.top + rect.height / 2) - gridRect.top;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        initGame();
    </script>
</body>
</html>
